name: Bosun
options:
  bundleIdPrefix: dev.bosun
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Bosun:
    type: application
    platform: macOS
    sources:
      - path: Bosun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bosun.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bosun
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_ENTITLEMENTS: Bosun/Bosun.entitlements
        ENABLE_APP_SANDBOX: NO

  BosunTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BosunTests
    dependencies:
      - target: Bosun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bosun.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bosun:
    build:
      targets:
        Bosun: all
        BosunTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [BosunTests]
    archive:
      config: Release